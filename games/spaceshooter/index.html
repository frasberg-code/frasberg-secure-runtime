<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Constellation Wars</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 16px 24px; color: #fff; font-size: 15px; pointer-events: none; z-index: 5; }
  #hud span { background: rgba(13,13,26,0.6); padding: 6px 14px; border-radius: 8px; border: 1px solid #6c63ff44; }
  .screen { position: fixed; inset: 0; background: rgba(13,13,26,0.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; z-index: 10; text-align: center; }
  .screen h1 { color: #6c63ff; font-size: 44px; letter-spacing: 6px; margin-bottom: 12px; }
  .screen p { color: #aaa; margin-bottom: 8px; }
  .screen button { margin-top: 24px; padding: 14px 42px; background: #6c63ff; color: #fff; border: none;
    border-radius: 30px; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: 2px; font-family: inherit; }
  .screen button:hover { background: #857dff; }
  #gameover { display: none; }
</style>
</head>
<body>
<script src="/api/games/assets/env.js"></script>
<div id="hud">
  <span>❤️ <b id="lives">3</b></span>
  <span>⭐ SCORE <b id="score">0</b></span>
  <span>🌊 WAVE <b id="wave">1</b></span>
</div>
<div id="start" class="screen">
  <h1>⬡ CONSTELLATION WARS</h1>
  <p>Frasberg Engine · Defend the Constellation Layer</p>
  <p>←/→ or A/D move · Space fire</p>
  <button id="startBtn">LAUNCH</button>
</div>
<div id="gameover" class="screen">
  <h1>SHIP LOST</h1>
  <p id="finalScore"></p>
  <button id="restartBtn">REDEPLOY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0x6c63ff, 1.5); key.position.set(0, 5, 10); scene.add(key);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(1200 * 3);
for (let i = 0; i < 1200; i++) {
  starPos[i*3] = (Math.random()-0.5) * 90;
  starPos[i*3+1] = (Math.random()-0.5) * 60;
  starPos[i*3+2] = -Math.random() * 60;
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x8888ff, size: 0.12 }));
scene.add(stars);

// Player ship
const ship = new THREE.Group();
const hull = new THREE.Mesh(new THREE.ConeGeometry(0.7, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x6c63ff, metalness: 0.5 }));
hull.rotation.x = Math.PI/2; hull.rotation.y = Math.PI/4; ship.add(hull);
[-1.1, 1.1].forEach(x => {
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.12, 0.9), new THREE.MeshStandardMaterial({ color: 0x2a2a4e }));
  wing.position.set(x, 0, 0.4); ship.add(wing);
});
ship.position.y = -9; scene.add(ship);
ship.rotation.x = -Math.PI/2;

let bullets = [], enemies = [], keys = {};
document.addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Space") fire(); });
document.addEventListener("keyup", e => keys[e.code] = false);

let running = false, score = 0, lives = 3, wave = 1, cooldown = 0;
function hud() {
  document.getElementById("lives").textContent = lives;
  document.getElementById("score").textContent = score;
  document.getElementById("wave").textContent = wave;
}
function fire() {
  if (!running || cooldown > 0) return;
  cooldown = 0.22;
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.5), new THREE.MeshBasicMaterial({ color: 0xffff66 }));
  b.position.copy(ship.position); b.position.y += 1.4;
  scene.add(b); bullets.push(b);
}
function spawnWave() {
  const rows = 2 + Math.min(wave, 4), cols = 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const e = new THREE.Mesh(new THREE.OctahedronGeometry(0.7),
      new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0x440011 }));
    e.position.set((c - cols/2 + 0.5) * 2.6, 12 + r * 2.2, 0);
    e.userData = { vx: 2 + wave * 0.4, drop: 0 };
    scene.add(e); enemies.push(e);
  }
}
function start() {
  bullets.forEach(b => scene.remove(b)); bullets = [];
  enemies.forEach(e => scene.remove(e)); enemies = [];
  score = 0; lives = 3; wave = 1; ship.position.x = 0; hud();
  spawnWave();
  document.getElementById("start").style.display = "none";
  document.getElementById("gameover").style.display = "none";
  running = true;
}
function gameOver() {
  running = false;
  document.getElementById("finalScore").textContent = `Score ${score} · Wave ${wave}`;
  document.getElementById("gameover").style.display = "flex";
}
document.getElementById("startBtn").onclick = start;
document.getElementById("restartBtn").onclick = start;

let dir = 1;
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  stars.position.y -= dt * 2; if (stars.position.y < -30) stars.position.y = 0;
  if (running) {
    if (cooldown > 0) cooldown -= dt;
    if (keys["ArrowLeft"] || keys["KeyA"]) ship.position.x -= 14 * dt;
    if (keys["ArrowRight"] || keys["KeyD"]) ship.position.x += 14 * dt;
    ship.position.x = Math.max(-14, Math.min(14, ship.position.x));
    ship.rotation.z = Math.sin(Date.now() * 0.003) * 0.06;

    bullets = bullets.filter(b => {
      b.position.y += 24 * dt;
      if (b.position.y > 16) { scene.remove(b); return false; }
      return true;
    });

    let edge = false;
    for (const e of enemies) {
      e.position.x += e.userData.vx * dir * dt;
      e.rotation.y += dt * 2; e.rotation.x += dt;
      if (Math.abs(e.position.x) > 15) edge = true;
    }
    if (edge) { dir *= -1; enemies.forEach(e => e.position.y -= 0.8); }

    enemies = enemies.filter(e => {
      for (let i = 0; i < bullets.length; i++) {
        if (e.position.distanceTo(bullets[i].position) < 0.9) {
          scene.remove(bullets[i]); bullets.splice(i, 1);
          scene.remove(e); score += 50; hud();
          return false;
        }
      }
      if (e.position.y < -7.5) {
        scene.remove(e); lives--; hud();
        if (lives <= 0) gameOver();
        return false;
      }
      return true;
    });
    if (enemies.length === 0 && running) { wave++; hud(); spawnWave(); }
  }
  renderer.render(scene, camera);
}
animate();
</script>
<script>
// ─── Leaderboard ──────────────────────────────────────────
const GID = "spaceshooter";
const lbScore = () => score;
(function () {
  document.getElementById("gameover").insertAdjacentHTML("beforeend", `
    <div style="margin-top:20px;width:min(340px,84vw)">
      <div style="display:flex;gap:8px">
        <input id="lbName" maxlength="20" placeholder="Your name" style="flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid #6c63ff66;background:#1a1a2e;color:#fff;font-family:inherit;outline:none">
        <button id="lbSubmit" style="padding:10px 18px;border-radius:12px;border:none;background:#6c63ff;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer;letter-spacing:1px">SUBMIT</button>
      </div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
        <span style="color:#6c63ff;font-size:12px;letter-spacing:2px">⬡ TOP PILOTS</span>
        <span style="display:flex;gap:6px">
          <button id="lbAll" class="lbTab" style="background:#6c63ff">ALL-TIME</button>
          <button id="lbWeek" class="lbTab" style="background:transparent">WEEK</button>
        </span>
      </div>
      <style>.lbTab{padding:4px 10px;border-radius:8px;border:1px solid #6c63ff66;color:#fff;font-family:inherit;font-size:10px;letter-spacing:1px;cursor:pointer}</style>
      <ol id="lbList" style="list-style:none;margin-top:8px;text-align:left;font-size:13px;color:#aaa;max-height:170px;overflow:auto"></ol>
    </div>`);
  const esc = (s) => String(s).replace(/[<>&]/g, "");
  let lbPeriod = "all";
  function setPeriod(p) {
    lbPeriod = p;
    document.getElementById("lbAll").style.background = p === "all" ? "#6c63ff" : "transparent";
    document.getElementById("lbWeek").style.background = p === "weekly" ? "#6c63ff" : "transparent";
    lbLoad();
  }
  document.getElementById("lbAll").addEventListener("click", () => setPeriod("all"));
  document.getElementById("lbWeek").addEventListener("click", () => setPeriod("weekly"));
  async function lbLoad() {
    try {
      const d = await (await fetch("/api/games/" + GID + "/scores?period=" + lbPeriod)).json();
      document.getElementById("lbList").innerHTML = d.map((s, i) =>
        `<li style="display:flex;justify-content:space-between;padding:3px 2px"><span>${i + 1}. ${esc(s.name)}</span><b style="color:#fff">${s.score}</b></li>`).join("") || "<li>No scores yet — be the first.</li>";
    } catch (_) {}
  }
  document.getElementById("lbName").value = localStorage.getItem("luchii-player-name") || "";
  document.getElementById("lbSubmit").addEventListener("click", async () => {
    const name = (document.getElementById("lbName").value || "PLAYER").trim().slice(0, 20) || "PLAYER";
    try { localStorage.setItem("luchii-player-name", name); } catch (_) {}
    try {
      await fetch("/api/games/" + GID + "/scores", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, score: lbScore() }) });
      document.getElementById("lbSubmit").textContent = "SAVED ✓";
      lbLoad();
    } catch (_) {}
  });
  const _gameOver = gameOver;
  gameOver = function () { _gameOver(); document.getElementById("lbSubmit").textContent = "SUBMIT"; lbLoad(); };
})();

// ─── Touch Controls ───────────────────────────────────────
(function () {
  if (!(matchMedia("(pointer: coarse)").matches || new URLSearchParams(location.search).has("touch"))) return;
  document.body.insertAdjacentHTML("beforeend", `
    <style>
      .tc{position:fixed;z-index:8;user-select:none;-webkit-user-select:none;touch-action:none}
      .tcBtn{width:72px;height:72px;border-radius:50%;background:rgba(108,99,255,.22);border:1px solid rgba(108,99,255,.6);color:#fff;font:bold 15px 'Courier New';letter-spacing:1px}
    </style>
    <button id="btnLeft" class="tc tcBtn" style="left:22px;bottom:34px">◀</button>
    <button id="btnRight" class="tc tcBtn" style="left:110px;bottom:34px">▶</button>
    <button id="btnFire" class="tc tcBtn" style="right:22px;bottom:34px;font-size:12px">FIRE</button>`);
  function bindBtn(id, key) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
    el.addEventListener("touchcancel", () => keys[key] = false);
  }
  bindBtn("btnLeft", "ArrowLeft");
  bindBtn("btnRight", "ArrowRight");
  let fireIv = null;
  const bf = document.getElementById("btnFire");
  bf.addEventListener("touchstart", (e) => { e.preventDefault(); fire(); fireIv = setInterval(fire, 120); });
  bf.addEventListener("touchend", (e) => { e.preventDefault(); clearInterval(fireIv); });
})();
</script>
<script>
// ─── SFX Engine + Champion banner ─────────────────────────
(function () {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem("luchii-sfx-muted") === "1"; } catch (_) {}
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(f0, f1, dur, type, vol) {
    if (muted) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
    } catch (_) {}
  }
  window.SFX = {
    tone,
    toggle() { muted = !muted; try { localStorage.setItem("luchii-sfx-muted", muted ? "1" : "0"); } catch (_) {} return muted; },
  };
  document.body.insertAdjacentHTML("beforeend",
    `<button id="sfxBtn" style="position:fixed;top:60px;right:24px;z-index:9;padding:8px 14px;border-radius:20px;border:1px solid #6c63ff66;background:rgba(13,13,26,.7);color:#fff;font:bold 11px 'Courier New';letter-spacing:1px;cursor:pointer">SFX ${muted ? "OFF" : "ON"}</button>`);
  document.getElementById("sfxBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("sfxBtn").textContent = "SFX " + (window.SFX.toggle() ? "OFF" : "ON");
  });
  // Hooks: laser / explosion / life lost / ship lost
  const _fireSh = fire;
  fire = function () { const n = bullets.length; _fireSh(); if (bullets.length > n && !muted) LuchiiAudio.sfx("laser", 0.3); };
  let _sc = 0, _lv = 3;
  setInterval(() => {
    if (running) {
      if (score > _sc && !muted) LuchiiAudio.sfx("explosion", 0.4);
      if (lives < _lv && !muted) LuchiiAudio.sfx("hit", 0.5);
    }
    _sc = score; _lv = lives;
  }, 100);
  const _goSh = gameOver;
  gameOver = function () { if (!muted) LuchiiAudio.sfx("lose", 0.6); _goSh(); };
})();
// Champion — score to beat
(function () {
  fetch("/api/games/" + GID + "/scores").then((r) => r.json()).then((d) => {
    if (!d.length) return;
    const c = d[0];
    document.querySelector("#start button").insertAdjacentHTML("beforebegin",
      `<p id="champLine" style="color:#fbbf24;margin-top:6px">♛ CHAMPION: ${String(c.name).replace(/[<>&]/g, "")} · ${c.score} — the score to beat</p>`);
  }).catch(() => {});
})();
// ─── Music + Gamepad ──────────────────────────────────────
(function () {
  let ctx = null, playing = false, timer = null, master = null;
  let mMuted = false, vol = 0.5;
  try { mMuted = localStorage.getItem("luchii-music-muted") === "1"; vol = parseFloat(localStorage.getItem("luchii-music-vol") || "0.5"); } catch (_) {}
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  const CFG = { bpm: 120, root: 49, bass: [0, 0, 3, -2], lead: [0, 3, 7, 12, 15, 12, 7, 3] };
  function note(f, t, dur, type, g, slide) {
    const c = ac(), o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(f / 4, 1), t + dur);
    gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn).connect(master); o.start(t); o.stop(t + dur);
  }
  function startMusic() {
    if (playing || mMuted) return;
    playing = true;
    window.LuchiiAudio && LuchiiAudio.music.start("/api/games/assets/music-spaceshooter.ogg", vol);
  }
  function stopMusic() { playing = false; window.LuchiiAudio && LuchiiAudio.music.stop(); }
  document.body.insertAdjacentHTML("beforeend", `
    <div id="musicCtl" style="position:fixed;top:102px;right:24px;z-index:9;display:flex;gap:8px;align-items:center;background:rgba(13,13,26,.7);border:1px solid #6c63ff66;border-radius:20px;padding:6px 12px">
      <button id="musicBtn" style="border:none;background:none;color:#fff;font:bold 11px 'Courier New';letter-spacing:1px;cursor:pointer">MUSIC ${mMuted ? "OFF" : "ON"}</button>
      <input id="musicVol" type="range" min="0" max="1" step="0.05" value="${vol}" style="width:70px;accent-color:#6c63ff">
    </div>
    <div id="padPill" style="display:none;position:fixed;top:60px;right:110px;z-index:9;padding:8px 14px;border-radius:20px;border:1px solid #44ffaa66;background:rgba(13,13,26,.7);color:#44ffaa;font:bold 11px 'Courier New';letter-spacing:1px">PAD CONNECTED</div>`);
  document.getElementById("musicBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    mMuted = !mMuted;
    try { localStorage.setItem("luchii-music-muted", mMuted ? "1" : "0"); } catch (_) {}
    document.getElementById("musicBtn").textContent = "MUSIC " + (mMuted ? "OFF" : "ON");
    if (mMuted) stopMusic(); else if (running) startMusic();
  });
  document.getElementById("musicVol").addEventListener("input", (e) => {
    vol = parseFloat(e.target.value);
    try { localStorage.setItem("luchii-music-vol", String(vol)); } catch (_) {}
    window.LuchiiAudio && LuchiiAudio.music.setVol(vol);
  });
  document.getElementById("startBtn").addEventListener("click", startMusic);
  document.getElementById("restartBtn").addEventListener("click", startMusic);
  // Gamepad
  let padIdx = null, prevBtns = {}, padKeys = {};
  window.addEventListener("gamepadconnected", (e) => { padIdx = e.gamepad.index; document.getElementById("padPill").style.display = "block"; });
  window.addEventListener("gamepaddisconnected", (e) => { if (e.gamepad.index === padIdx) { padIdx = null; document.getElementById("padPill").style.display = "none"; } });
  function pressStart() {
    for (const id of ["startBtn", "restartBtn"]) {
      const el = document.getElementById(id);
      if (el && el.offsetParent !== null) { el.click(); return; }
    }
  }
  const DZ = 0.28;
  (function padLoop() {
    requestAnimationFrame(padLoop);
    const gp = padIdx !== null ? navigator.getGamepads()[padIdx] : null;
    if (!gp) return;
    const lx = gp.axes[0] || 0;
    const set = {};
    if (lx < -DZ) set["ArrowLeft"] = 1; if (lx > DZ) set["ArrowRight"] = 1;
    for (const k in padKeys) if (!set[k]) keys[k] = false;
    for (const k in set) keys[k] = true;
    padKeys = set;
    if (running && (gp.buttons[0]?.pressed || gp.buttons[7]?.pressed)) fire();
    if (gp.buttons[9]?.pressed && !prevBtns[9]) pressStart();
    prevBtns = { 9: gp.buttons[9]?.pressed };
  })();
})();
</script>
</body>
</html>
;
})();
</script>
</body>
</html>
